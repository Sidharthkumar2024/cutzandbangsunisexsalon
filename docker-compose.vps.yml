name: cutz-bangs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/.storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ./backend
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/.storage

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    environment:
      BACKEND_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ""
      SITE_CONTENT_FILE: /app/.storage/site-content.json
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - sitecontent:/app/.storage

  waha:
    image: devlikeapro/waha
    profiles: ["unofficial-wa"]
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_PRINT_QR: "false"
    expose: ["3000"]
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header", "X-Api-Key: ${WAHA_API_KEY}", "http://localhost:3000/api/sessions"]
      interval: 15s
      timeout: 5s
      retries: 8

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  waha_sessions:
  caddydata:
  caddyconfig:
  media:
  sitecontent:
