name: cutz-bangs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/.storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ./backend
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/.storage

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    environment:
      BACKEND_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ""
      SITE_CONTENT_FILE: /app/.storage/site-content.json
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - sitecontent:/app/.storage

  waha:
    image: devlikeapro/waha:2026.6.1
    profiles: ["unofficial-wa"]
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    expose: ["3000"]
    volumes:
      - waha_sessions:/app/.sessions
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/server/status',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Keep the public proxy valid even if the shell running Compose does not
      # export DOMAIN. An empty value makes Caddy interpret the site block as a
      # global options block and it exits before binding ports 80/443.
      DOMAIN: ${DOMAIN:-cutzandbangs.com}
    volumes:
      - ./backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  waha_sessions:
  caddydata:
  caddyconfig:
  media:
  sitecontent:
