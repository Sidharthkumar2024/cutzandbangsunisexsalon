name: cutz-bangs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/.storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ./backend
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/.storage

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: ${CUTZ_ENV_FILE:-./backend/.env.production}
    environment:
      BACKEND_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ""
      SITE_CONTENT_FILE: /app/.storage/site-content.json
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - sitecontent:/app/.storage

  evolution-db:
    image: postgres:16-alpine
    profiles: ["unofficial-wa"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 8

  evolution:
    image: evoapicloud/evolution-api:latest
    profiles: ["unofficial-wa"]
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: cutz-evolution
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${WA_UNOFFICIAL_CALLBACK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
    expose: ["8080"]
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Keep the public proxy valid even if the shell running Compose does not
      # export DOMAIN. An empty value makes Caddy interpret the site block as a
      # global options block and it exits before binding ports 80/443.
      DOMAIN: ${DOMAIN:-cutzandbangs.com}
    volumes:
      - ./backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  evolution_pgdata:
  evolution_instances:
  caddydata:
  caddyconfig:
  media:
  sitecontent:
